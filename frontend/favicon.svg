<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="16" fill="#0f172a"/>
  <defs>
    <linearGradient id="brainGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00f0ff"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Stylized Brain Contour -->
  <g stroke="url(#brainGrad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Left Hemisphere -->
    <path d="M26 12C20 12 14 17 14 23C14 26 15 28 16 30C13 32 12 36 12 40C12 45 16 49 21 50C23 50 25 49 26 48C28 51 31 52 32 52V12Z" fill="rgba(56, 189, 248, 0.08)"/>
    <!-- Right Hemisphere -->
    <path d="M38 12C44 12 50 17 50 23C50 26 49 28 48 30C51 32 52 36 52 40C52 45 48 49 43 50C41 50 39 49 38 48C36 51 33 52 32 52V12Z" fill="rgba(37, 99, 235, 0.08)"/>
    
    <!-- Central Divider -->
    <line x1="32" y1="14" x2="32" y2="50" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2 3"/>
    
    <!-- Neural Synapses & Interconnects -->
    <circle cx="22" cy="24" r="2.5" fill="#00f0ff"/>
    <circle cx="42" cy="24" r="2.5" fill="#38bdf8"/>
    <circle cx="20" cy="38" r="2.5" fill="#38bdf8"/>
    <circle cx="44" cy="38" r="2.5" fill="#00f0ff"/>
    <circle cx="32" cy="32" r="3" fill="#00f0ff"/>
    
    <path d="M22 24L32 32L42 24" stroke="url(#brainGrad)" stroke-width="1.8"/>
    <path d="M20 38L32 32L44 38" stroke="url(#brainGrad)" stroke-width="1.8"/>
  </g>
</svg>
